<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your OTP</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f8;
            padding: 30px;
            color: #333;
        }

        h3 {
            color: #007bff;
        }

        p {
            font-size: 16px;
            line-height: 1.6;
        }

        strong {
            color: #d63384;
        }
    </style>
</head>
<body>
    <h3>Hello {{ user.username }},</h3>
    <p>Your login OTP is <strong>{{ otp }}</strong>. It is valid for <strong>{{ validity }}</strong>.</p>
    <p>Please enter the OTP on the verification page to log in.</p>
    <p>If you did not request this, please ignore this email.</p>
</body>
</html>
